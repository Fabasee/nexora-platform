name: Office Web checks

on:
  push:
    paths:
      - "apps/office-web/**"
      - ".github/workflows/office-web-checks.yml"
  pull_request:
    paths:
      - "apps/office-web/**"
      - ".github/workflows/office-web-checks.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  office-web-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/office-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
