name: Mobile checks

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-checks.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-checks.yml"

jobs:
  mobile-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npx expo install --check
